<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Мой список задач</title>
    <link href="https://fonts.googleapis.com/css2?family=Comfortaa:wght@400;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/static/style.css">
</head>
<body>
    <h1>Мои задачи</h1>

    <form action="/add" method="post">
        <input type="text" name="task" placeholder="Что нужно сделать?" required>
        <button type="submit" class="btn-add">Добавить</button>
    </form>

    <ul>
        {% for zadacha in zadachi %}
        <li class="{{ 'done' if zadacha.sdelano }}">
            <span>{{ zadacha.tekst }}</span>
            <a href="/toggle/{{ loop.index0 }}" class="btn btn-toggle">
                {{ 'Вернуть' if zadacha.sdelano else 'Готово' }}
            </a>
            <a href="/delete/{{ loop.index0 }}" class="btn btn-delete">Удалить</a>
        </li>
        {% else %}
        <li>Пока нет задач. Добавьте первую!</li>
        {% endfor %}
    </ul>
</body>
</html>
